name: Build Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.21.1"
            zip: "pvpbot-1.21.1.zip"
            java: "21"
          - version: "1.21.11"
            zip: "pvpbot-1.21.11.zip"
            java: "21"
          - version: "26.1.2"
            zip: "pvpbot-26.1.2.zip"
            java: "25"

    name: Build (${{ matrix.version }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and prepare project
        run: |
          ZIP_FILE="${{ matrix.zip }}"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "❌ Archive not found: $ZIP_FILE"
            exit 1
          fi

          echo "📦 Extracting: $ZIP_FILE"
          mkdir -p build_${{ matrix.version }}
          unzip -o -q "$ZIP_FILE" -d build_${{ matrix.version }}

          # If extracted into a subfolder — move contents up
          DIRS=$(find build_${{ matrix.version }} -maxdepth 1 -mindepth 1 -type d)
          DIR_COUNT=$(echo "$DIRS" | grep -c .)
          if [ "$DIR_COUNT" -eq 1 ] && [ ! -f "build_${{ matrix.version }}/settings.gradle" ]; then
            SUBDIR=$(echo "$DIRS" | head -n 1)
            echo "📁 Moving contents from $SUBDIR"
            cp -rn "$SUBDIR/." build_${{ matrix.version }}/
            rm -rf "$SUBDIR"
          fi

          echo "📂 Project contents:"
          ls -la build_${{ matrix.version }}/

          if [ ! -f "build_${{ matrix.version }}/settings.gradle" ] && [ ! -f "build_${{ matrix.version }}/settings.gradle.kts" ]; then
            echo "❌ settings.gradle not found!"
            exit 1
          fi
          echo "✅ Ready"

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: build_${{ matrix.version }}
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.version }}
          path: build_${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error
