name: Build Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1.21.1"
            java: "21"
          - version: "1.21.11"
            java: "21"
          - version: "26.1.2"
            java: "25"

    name: Build (${{ matrix.version }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and prepare project
        run: |
          VERSION="${{ matrix.version }}"

          # Search for any zip containing the version string (dots or underscores)
          VERSION_PATTERN="${VERSION//./_}"
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | grep -E "${VERSION//./\\.}|${VERSION_PATTERN}" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No archive found matching version: $VERSION"
            echo "Available zips:"
            ls *.zip 2>/dev/null || echo "(none)"
            exit 1
          fi

          echo "📦 Found archive: $ZIP_FILE"
          mkdir -p build_$VERSION
          unzip -o -q "$ZIP_FILE" -d build_$VERSION

          # If extracted into a subfolder — move contents up
          DIRS=$(find build_$VERSION -maxdepth 1 -mindepth 1 -type d)
          DIR_COUNT=$(echo "$DIRS" | grep -c .)
          if [ "$DIR_COUNT" -eq 1 ] && [ ! -f "build_$VERSION/settings.gradle" ]; then
            SUBDIR=$(echo "$DIRS" | head -n 1)
            echo "📁 Moving contents from $SUBDIR"
            cp -rn "$SUBDIR/." build_$VERSION/
            rm -rf "$SUBDIR"
          fi

          echo "📂 Project contents:"
          ls -la build_$VERSION/

          if [ ! -f "build_$VERSION/settings.gradle" ] && [ ! -f "build_$VERSION/settings.gradle.kts" ]; then
            echo "❌ settings.gradle not found!"
            exit 1
          fi
          echo "✅ Ready"

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: build_${{ matrix.version }}
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.version }}
          path: build_${{ matrix.version }}/build/libs/*.jar
          if-no-files-found: error
