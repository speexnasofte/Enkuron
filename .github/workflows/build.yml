name: Build Mod

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and prepare project
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No zip archive found"
            find . -maxdepth 2 -type f | head -30
            exit 1
          fi

          echo "📦 Found archive: $ZIP_FILE"
          mkdir -p build_mod
          unzip -o -q "$ZIP_FILE" -d build_mod

          # If extracted into a subfolder — move contents up
          DIRS=$(find build_mod -maxdepth 1 -mindepth 1 -type d)
          DIR_COUNT=$(echo "$DIRS" | grep -c .)
          if [ "$DIR_COUNT" -eq 1 ] && [ ! -f "build_mod/settings.gradle" ]; then
            SUBDIR=$(echo "$DIRS" | head -n 1)
            echo "📁 Moving contents from $SUBDIR"
            cp -rn "$SUBDIR/." build_mod/
            rm -rf "$SUBDIR"
          fi

          echo "📂 Project contents:"
          ls -la build_mod/

          if [ ! -f "build_mod/settings.gradle" ] && [ ! -f "build_mod/settings.gradle.kts" ]; then
            echo "❌ settings.gradle not found!"
            exit 1
          fi
          echo "✅ Ready"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        working-directory: build_mod
        run: gradle build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-build
          path: build_mod/build/libs/*.jar
          if-no-files-found: error
